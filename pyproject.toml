[project]
name = "agentspaces-client"
version = "0.4.0"
description = "Wire-compatible AgentSpaces peer in Python: joins Java fleets over TCP, writes signed entries, reads spaces through anti-entropy."
requires-python = ">=3.11"
dependencies = ["cryptography>=42,<47"]
license = {text = "Apache-2.0"}

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["agentspaces"]
